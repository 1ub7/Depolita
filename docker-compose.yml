services:
  mysql:
    image: mysql:8.4
    container_name: depolita_db
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: ./web
    container_name: depolita_web
    environment:
      # nginx 가 /api 요청을 넘길 Spring Boot 주소
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:8081}
    extra_hosts:
      # 리눅스(EC2)에서도 host.docker.internal 로 호스트에 접근할 수 있게 한다
      - "host.docker.internal:host-gateway"
    ports:
      - "${WEB_PORT:-3000}:8080"
    restart: unless-stopped

volumes:
  mysql-data:
