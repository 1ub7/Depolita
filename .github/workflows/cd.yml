name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "되돌릴 커밋 SHA (40자). 그 커밋의 이미지가 GHCR 에 있어야 한다"
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/1ub7
  AWS_REGION: ap-northeast-2

jobs:
  build:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - id: meta
        run: echo "tag=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push server
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.REGISTRY }}/depolita-server:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/depolita-server:latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            ${{ env.REGISTRY }}/depolita-web:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/depolita-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build
    # 자동 배포(build 성공) 또는 수동 롤백(build 건너뜀)일 때 실행
    if: >-
      always() &&
      (needs.build.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && needs.build.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC: AWS 장기 키 없이 역할을 받는다
    env:
      TAG: ${{ needs.build.outputs.tag || inputs.tag }}
    steps:
      - name: Validate tag
        run: |
          if ! [[ "$TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::커밋 SHA 40자가 필요합니다: $TAG"
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM (depolita-deploy)
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name depolita-deploy \
            --parameters "tag=$TAG" \
            --comment "deploy $TAG" \
            --query Command.CommandId --output text)
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"
          echo "SSM command: $COMMAND_ID"

          # 기본 waiter 는 약 100초에서 멈추므로 직접 기다린다 (최대 15분)
          for _ in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success) echo "배포 성공"; exit 0 ;;
              Failed|Cancelled|TimedOut) echo "::error::배포 실패 ($STATUS)"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::배포 결과를 기다리다 시간이 초과됐습니다"
          exit 1

      - name: Show deploy log
        if: always() && env.COMMAND_ID != ''
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '{stdout: StandardOutputContent, stderr: StandardErrorContent}' --output text || true
