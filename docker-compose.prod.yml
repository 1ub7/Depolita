name: depolita

# 공개 서버는 스캐너 요청으로 로그가 계속 쌓인다. 도커 기본값(json-file)은 크기 제한이 없어서
# 디스크가 차면 빌드·MySQL 이 같이 멈추므로 컨테이너당 최대 30MB (10MB x 3) 로 제한한다.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.4
    logging: *default-logging
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  server:
    build: ./server
    logging: *default-logging
    network_mode: host
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      DB_URL: jdbc:mysql://127.0.0.1:3307/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      ALLOWED_ACCOUNTS: ${ALLOWED_ACCOUNTS}
      DEPOLITA_API_KEY: ${DEPOLITA_API_KEY}
      PUBLIC_HOST: ${PUBLIC_HOST}
      DOCKER_HOST: unix:///var/run/docker.sock
      TZ: Asia/Seoul
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  web:
    build: ./web
    logging: *default-logging
    environment:
      API_UPSTREAM: http://host.docker.internal:8081
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2
    logging: *default-logging
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"  
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data       
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  caddy-data:
  caddy-config:
