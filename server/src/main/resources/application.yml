spring:
  application:
    name: Depolita
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false

server:
  forward-headers-strategy: native

docker:
  host: ${DOCKER_HOST:unix:///var/run/docker.sock}

allowed-accounts: ${ALLOWED_ACCOUNTS:}

depolita:
  api-key: ${DEPOLITA_API_KEY:}
  public-host: ${PUBLIC_HOST:localhost}
  reconcile-interval-ms: ${RECONCILE_INTERVAL_MS:30000}
  webhook:
    github-secret: ${GITHUB_WEBHOOK_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
