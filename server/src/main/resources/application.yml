spring:
  application:
    name: Depolita
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false

docker:
  host: ${DOCKER_HOST:unix:///var/run/docker.sock}

allowed-accounts: ${ALLOWED_ACCOUNTS:}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true