spring:
  application:
    name: Depolita
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false

management:
  docker:
    host: npipe:////./pipe/docker_engine
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true