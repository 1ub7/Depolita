server:
  port: 8081
spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3307/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
docker:
  host: ${DOCKER_HOST:npipe:////./pipe/docker_engine}

logging:
  level:
    org.hibernate.SQL: debug